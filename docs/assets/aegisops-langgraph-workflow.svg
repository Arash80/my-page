<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 837 654" role="img" aria-labelledby="title desc">
  <title id="title">AegisOps LangGraph incident investigation workflow</title>
  <desc id="desc">A monitoring report is loaded and triaged. The workflow routes model unavailability, feature drift, general investigations, and schema failures to specialized investigation nodes. All routes load model metadata, generate a diagnosis, and end.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#303036"/>
    </marker>
    <style>
      .node { fill: #f5f2ff; stroke: #8b5cf6; stroke-width: 1.3; }
      .terminal { fill: #ddd4ff; stroke: #8b5cf6; stroke-width: 1.3; }
      .node-text { fill: #34343b; font: 16px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #34343b; font: 16px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .label-bg { fill: #f3f3f3; }
      .edge { fill: none; stroke: #303036; stroke-width: 1.15; marker-end: url(#arrow); }
      .route { fill: none; stroke: #303036; stroke-width: 1.05; stroke-dasharray: 2.5 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="837" height="654" fill="#ffffff"/>

  <rect class="node" x="378" y="8" width="91" height="34" rx="18"/>
  <text class="node-text" x="423.5" y="25">__start__</text>

  <rect class="node" x="326" y="92" width="195" height="50" rx="6"/>
  <text class="node-text" x="423.5" y="117">load_monitoring_report</text>

  <rect class="node" x="357" y="191" width="134" height="50" rx="6"/>
  <text class="node-text" x="424" y="216">triage_incident</text>

  <rect class="node" x="10" y="314" width="190" height="50" rx="6"/>
  <text class="node-text" x="105" y="339">investigate_availability</text>

  <rect class="node" x="249" y="314" width="144" height="50" rx="6"/>
  <text class="node-text" x="321" y="339">investigate_drift</text>

  <rect class="node" x="442" y="314" width="170" height="50" rx="6"/>
  <text class="node-text" x="527" y="339">investigate_general</text>

  <rect class="node" x="661" y="314" width="171" height="50" rx="6"/>
  <text class="node-text" x="746.5" y="339">investigate_schema</text>

  <rect class="node" x="329" y="413" width="189" height="50" rx="6"/>
  <text class="node-text" x="423.5" y="438">load_model_metadata</text>

  <rect class="node" x="338" y="513" width="171" height="50" rx="6"/>
  <text class="node-text" x="423.5" y="538">generate_diagnosis</text>

  <rect class="terminal" x="381" y="612" width="86" height="34" rx="18"/>
  <text class="node-text" x="424" y="629">__end__</text>

  <path class="edge" d="M423.5 42 L423.5 92"/>
  <path class="edge" d="M423.5 142 L423.5 191"/>

  <path class="route" d="M376 240 C300 257 187 276 105 314"/>
  <path class="route" d="M405 241 C380 264 345 285 321 314"/>
  <path class="route" d="M446 241 C470 265 504 286 527 314"/>
  <path class="route" d="M472 240 C560 259 669 279 746.5 314"/>

  <rect class="label-bg" x="29" y="265" width="153" height="25"/>
  <text class="label" x="105.5" y="277.5">model_unavailability</text>

  <rect class="label-bg" x="274" y="265" width="95" height="25"/>
  <text class="label" x="321.5" y="277.5">feature_drift</text>

  <rect class="label-bg" x="447" y="265" width="160" height="25"/>
  <text class="label" x="527" y="277.5">general_investigation</text>

  <rect class="label-bg" x="689" y="265" width="116" height="25"/>
  <text class="label" x="747" y="277.5">schema_failure</text>

  <path class="edge" d="M105 364 L105 389 L329 423"/>
  <path class="edge" d="M321 364 L321 389 L373 413"/>
  <path class="edge" d="M527 364 L527 389 L475 413"/>
  <path class="edge" d="M746.5 364 L746.5 389 L518 423"/>

  <path class="edge" d="M423.5 463 L423.5 513"/>
  <path class="edge" d="M423.5 563 L423.5 612"/>
</svg>
